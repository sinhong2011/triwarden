name: Site

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  # A release does not touch site/**, so the path filters above would skip it. release.yml starts this once the
  # release and its Triwarden.dmg are published (a release made with GITHUB_TOKEN can't fire a `release` event), so
  # the baked version text matches the new release. The client script covers the gap before this finishes.
  # Also Actions › Site › Run workflow on main, to redeploy by hand.
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests, main pushes, and runs after a release all build. Deploy is the step that is limited.
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
        run: pnpm build

  deploy:
    name: Deploy to Cloudflare Pages
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH }}
        run: pnpm build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./site/dist --project-name ${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch main
